version: '3.8'

services:
  agricrop:
    build:
      context: .
      dockerfile: Dockerfile
    image: agricrop-platform:latest
    container_name: agricrop_app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PORT=5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
