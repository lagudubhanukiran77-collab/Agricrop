name: AgriCrop CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build Frontend & Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Frontend Production Assets
        working-directory: ./frontend
        run: npm run build

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Backend Syntax and Model Loading
        working-directory: ./backend
        run: |
          python -m py_compile app.py
          python -c "import joblib; model = joblib.load('models/soil_moisture_model.joblib'); print('Model loaded successfully:', type(model))"

      - name: Test Unified Server Startup and Healthcheck
        run: |
          cd backend
          python app.py &
          SERVER_PID=$!
          sleep 5
          curl -f http://127.0.0.1:5000/api/health || exit 1
          curl -f http://127.0.0.1:5000/ || exit 1
          kill $SERVER_PID
